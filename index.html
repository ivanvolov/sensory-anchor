<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sensory Anchor — 5·4·3·2·1 на Apple Watch</title>
<style>
:root{
  --page:#0B0B0C; --page2:#131316; --fg:#EDEDEF; --dim:#8B8B93; --line:#26262B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--fg); -webkit-font-smoothing:antialiased;
  font-family:ui-sans-serif,-apple-system,"Inter","Segoe UI",system-ui,sans-serif;
  padding:0 0 100px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* ---------- page chrome ---------- */
header{padding:56px 0 30px;border-bottom:1px solid var(--line);margin-bottom:8px}
h1{font-size:31px;line-height:1.15;letter-spacing:-.02em;margin:0 0 12px;font-weight:650}
.lede{color:var(--dim);font-size:15.5px;line-height:1.62;max-width:670px;margin:0}
.lede b{color:var(--fg);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;margin-top:26px;flex-wrap:wrap}
.chip{
  appearance:none;border:1px solid var(--line);background:var(--page2);color:var(--dim);
  font:inherit;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer;transition:.14s;
}
.chip:hover{color:var(--fg);border-color:#3A3A42}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--page);border-color:var(--fg)}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 6px}

/* ---------- style section ---------- */
section{padding:52px 0;border-bottom:1px solid var(--line)}
.shead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.snum{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;letter-spacing:.14em}
.sname{font-size:21px;font-weight:620;letter-spacing:-.01em}
.stag{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
.swhy{color:var(--dim);font-size:14.5px;line-height:1.6;max-width:640px;margin:0 0 30px}
.row{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:11px}
.clabel{font-size:12px;color:var(--dim);letter-spacing:.03em}

/* ---------- watch hardware ---------- */
.watch{
  width:224px;height:272px;border-radius:58px;padding:11px;position:relative;
  background:linear-gradient(150deg,#55555C,#232328 42%,#3E3E45 72%,#1A1A1E);
  box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07) inset;
}
.watch::after{ /* digital crown */
  content:"";position:absolute;right:-5px;top:78px;width:7px;height:34px;border-radius:3px;
  background:linear-gradient(90deg,#6A6A72,#2A2A30);
}
.watch::before{ /* side button */
  content:"";position:absolute;right:-3px;top:132px;width:4px;height:26px;border-radius:3px;
  background:linear-gradient(90deg,#55555C,#25252A);
}
.screen{
  width:100%;height:100%;border-radius:48px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}

/* ================= SHARED SCREEN LAYOUT ================= */
.sc{flex:1;display:flex;flex-direction:column;padding:16px 19px 17px;position:relative;z-index:2}
.sc-top{font-size:12.5px;font-weight:600;letter-spacing:.01em;margin-bottom:2px}
.sc-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:0}
.sc-acts{display:flex;gap:7px;align-items:stretch}
.btn{
  flex:1;border:0;font:inherit;font-size:14px;font-weight:600;border-radius:999px;
  padding:11px 6px;cursor:default;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn.sq{flex:0 0 46px;padding:11px 0}
.btn svg{width:17px;height:17px}
.big{font-size:60px;line-height:.92;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sub{font-size:12px;opacity:.6;text-align:center;line-height:1.3}
.glyph{width:48px;height:48px}
.beast{width:92px;height:92px;margin-bottom:-4px}
.ring{width:132px;height:132px;display:block}
.ring .trk{opacity:.16}
.chips{display:flex;gap:5px;margin-top:3px}
.chips i{
  font-style:normal;font-size:10.5px;width:19px;height:19px;border-radius:50%;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}

/* ================= 1. watchOS native ================= */
.st-native .screen{background:#000;color:#fff;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif}
.st-native .sc-top{color:#30D158;text-transform:none}
.st-native .big{font-weight:250}
.st-native .ring .trk{stroke:#30D158}
.st-native .ring .val{stroke:#30D158}
.st-native .btn{background:#1F1F22;color:#fff}
.st-native .btn.pri{background:#30D158;color:#00150A}
.st-native .glyph{color:#30D158}
.st-native .chips i{background:#1F1F22;color:#8E8E93}

/* ================= 2. Clay — polished iOS ================= */
.st-clay .screen{
  background:radial-gradient(150% 112% at 50% -14%,#FCF8F2 0%,#F0E8DD 46%,#E1D5C5 100%);
  color:#3B342B;letter-spacing:-.011em;
  font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;
}
.st-clay .screen::after{ /* paper tooth, so it doesn't read as flat plastic */
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.14;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/></filter><rect width='90' height='90' filter='url(%23c)' opacity='.6'/></svg>");
}
.st-clay .sc-top{color:#A4907A;font-weight:590;font-size:12px;letter-spacing:0}
.st-clay .big{font-weight:580;color:#2E2822;letter-spacing:-.045em}
.st-clay .ring .trk{stroke:#DACEBE}
.st-clay .ring .val{stroke:#C08457;stroke-linecap:round}
.st-clay .glyph{color:#BD8257}
.st-clay .sub{opacity:.55;font-weight:450}
.st-clay .btn{
  background:linear-gradient(180deg,#FFFDFA,#F3ECE1);color:#443C32;font-weight:590;
  box-shadow:0 .5px 0 rgba(255,255,255,.95) inset,
             0 0 0 .5px rgba(92,74,52,.14),
             0 1px 1.5px rgba(74,58,40,.07),
             0 7px 16px -5px rgba(74,58,40,.18);
}
.st-clay .btn.pri{
  background:linear-gradient(180deg,#CE9468,#B4764A);color:#FFFAF4;
  box-shadow:0 .5px 0 rgba(255,255,255,.4) inset,
             0 0 0 .5px rgba(124,78,40,.4),
             0 1px 2px rgba(124,78,40,.2),
             0 9px 18px -6px rgba(124,78,40,.45);
}
.st-clay .chips i{background:#E7DCCC;color:#6E6152;font-weight:600;
  box-shadow:0 0 0 .5px rgba(92,74,52,.13)}

/* ================= 3. Fauna — living, overgrown ================= */
.st-fauna .screen{
  --ink:#CFE3C2; --bg2:#0B1710; --accent:#F2B33D;
  background:radial-gradient(122% 80% at 50% 2%,#2C4E35 0%,#152A1C 54%,#070F0A 100%);
  color:#E9F3E2;
  font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
}
.st-fauna .scene{position:absolute;inset:0;z-index:1;overflow:hidden;border-radius:inherit}
.st-fauna .fx-shaft{
  position:absolute;top:-46px;left:16%;width:66%;height:74%;filter:blur(11px);
  background:linear-gradient(180deg,rgba(204,242,166,.3),rgba(204,242,166,0) 74%);
  animation:shaft 9s ease-in-out infinite alternate;
}
@keyframes shaft{from{opacity:.5;transform:translateX(-7px) scaleX(.94)}
                 to{opacity:1;transform:translateX(7px) scaleX(1.06)}}
.st-fauna .fx-leaves{position:absolute;left:-7px;bottom:-12px;width:calc(100% + 14px);
  transform-origin:50% 100%;display:block}
.st-fauna .fx-back {height:78px;animation:sway 7.5s ease-in-out infinite alternate}
.st-fauna .fx-mid  {height:66px;animation:sway 6s ease-in-out -1.5s infinite alternate-reverse}
.st-fauna .fx-front{height:56px;animation:sway 5s ease-in-out -.8s infinite alternate}
@keyframes sway{from{transform:rotate(-1.5deg) translateY(1px)}
                to{transform:rotate(1.5deg) translateY(-3px)}}
.st-fauna .fx-corner{position:absolute;top:-8px;width:76px;height:56px;transform-origin:50% 0}
.st-fauna .fx-tl{left:-12px;animation:swayS 8s ease-in-out infinite alternate}
.st-fauna .fx-tr{right:-12px;animation:swayS 7s ease-in-out -2s infinite alternate-reverse}
@keyframes swayS{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
.st-fauna .fx-sprig{position:absolute;top:56%;width:56px;height:50px;transform-origin:50% 50%}
.st-fauna .fx-sl{left:-14px;animation:swayS 9s ease-in-out -3s infinite alternate}
.st-fauna .fx-sr{right:-14px;animation:swayS 8.5s ease-in-out -1s infinite alternate-reverse}
.st-fauna .fx-flies{position:absolute;inset:0}
.st-fauna .fx-flies i{
  position:absolute;width:4px;height:4px;border-radius:50%;background:#FFEBAF;
  box-shadow:0 0 8px 2.5px rgba(255,220,130,.7);
  left:calc(13% + var(--i) * 15%);top:calc(26% + var(--i) * 8%);
  animation:fly calc(6s + var(--i) * 1.3s) ease-in-out infinite alternate,
            glow calc(2.3s + var(--i) * .45s) ease-in-out infinite;
}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(17px,-24px)}}
@keyframes glow{0%,100%{opacity:.22}50%{opacity:1}}
.st-fauna .sc-top{
  color:#16240F;background:#F2B33D;font-weight:800;letter-spacing:.02em;
  align-self:flex-start;padding:3px 10px;border-radius:999px;font-size:11.5px;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.st-fauna .big{font-weight:700;color:#FFD979;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.st-fauna .sub{opacity:.78}
.st-fauna .dial{position:relative;display:grid;place-items:center}
.st-fauna .dial::before{content:"";position:absolute;width:104px;height:58px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(5,14,9,.8),rgba(5,14,9,0));filter:blur(3px)}
.st-fauna .vine{width:136px;height:136px;display:block}
.st-fauna .vine .stem{animation:grow 2.8s ease-out both}
@keyframes grow{from{stroke-dashoffset:351.86}}
.st-fauna .dial-t{position:absolute;font-size:31px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.st-fauna .beast{width:76px;height:76px;margin-bottom:-6px;transform-origin:50% 92%;
  animation:breathe 3.4s ease-in-out infinite;filter:drop-shadow(0 4px 9px rgba(0,0,0,.45))}
@keyframes breathe{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.05) translateY(-2px)}}
.st-fauna .beast .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.st-fauna .sc-mid .big{font-size:46px}
.st-fauna .latin{font-size:10px;font-style:italic;opacity:.62;letter-spacing:.02em}
.st-fauna .fx-bloom{width:106px;height:98px;filter:drop-shadow(0 5px 11px rgba(0,0,0,.45))}
.st-fauna .fx-bloom .fx-petals{transform-box:fill-box;transform-origin:center;
  animation:open 1.3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes open{from{transform:scale(.15) rotate(-50deg)}}
.st-fauna .fx-bloom .fx-leafL,.st-fauna .fx-bloom .fx-leafR{
  transform-box:fill-box;transform-origin:0 50%;animation:frond 4.4s ease-in-out infinite alternate}
.st-fauna .fx-bloom .fx-leafR{animation-delay:-2.2s}
@keyframes frond{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.st-fauna .btn{background:#2A4A33;color:#DCEDD3;font-weight:800;
  box-shadow:0 0 0 1px rgba(160,210,150,.18) inset,0 4px 12px rgba(0,0,0,.4)}
.st-fauna .btn.pri{background:linear-gradient(180deg,#F7C25A,#EDA92B);color:#16240F;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 5px 14px rgba(0,0,0,.45)}
.st-fauna .chips i{background:#2A4A33;color:#A9CB9E;font-weight:800;
  box-shadow:0 0 0 1px rgba(160,210,150,.16) inset}

/* ---------- fauna legend ---------- */
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.lcard{
  flex:1 1 168px;border:1px solid var(--line);border-radius:15px;padding:14px;
  background:linear-gradient(170deg,#14211A,#0D1410);
  --ink:#CFE3C2; --bg2:#0E1A14; --accent:#F2B33D;
}
.lcard svg{width:52px;height:52px;display:block;margin-bottom:9px}
.lsense{font-size:11px;color:#F2B33D;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.lname{font-size:14.5px;font-weight:620;margin:3px 0 5px}
.lwhy{font-size:11.6px;line-height:1.5;color:var(--dim)}
.lwhy em{font-style:italic;opacity:.8}

footer{padding:46px 0;color:var(--dim);font-size:13.5px;line-height:1.7;max-width:660px}
footer a{color:#9FB6A6;text-decoration:underline;text-underline-offset:3px}
footer a:hover{color:#E4EFDD}
footer code{background:var(--page2);padding:1px 6px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="bar" id="bar"></div>
  </header>
  <main id="board"></main>
  <footer id="foot"></footer>
</div>
<script>
/* Hand-authored SVG. No generated imagery — deliberate: the recipient
   has publicly said AI art is a dealbreaker for her projects. */

const ICON = {
  eye: `<svg viewBox="0 0 48 48" fill="none"><path d="M3 24s7.6-12.5 21-12.5S45 24 45 24s-7.6 12.5-21 12.5S3 24 3 24z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="24" r="6.5" fill="currentColor"/></svg>`,
  ear: `<svg viewBox="0 0 48 48" fill="none"><path d="M15 21a9 9 0 1118 0c0 6.5-6.5 7.5-6.5 13.5A5.5 5.5 0 0121 40" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M22 22a3.4 3.4 0 016.8 0c0 3.4-3.4 3.6-3.4 7.2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`,
  hand: `<svg viewBox="0 0 48 48" fill="none"><path d="M17 27V13.5a3.2 3.2 0 016.4 0V25M23.4 25V10.5a3.2 3.2 0 016.4 0V26M29.8 26V15.5a3.2 3.2 0 016.4 0V31c0 7.7-5.2 12.5-12.3 12.5S11.5 38.5 11.5 31.5v-8.8a3.2 3.2 0 016.4 0V27" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  nose: `<svg viewBox="0 0 48 48" fill="none"><path d="M27 6c0 10-2.5 14.5-6 19.5-2.6 3.7-1 7.5 2.6 7.5H26" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M17.5 33c0 5 3.5 8 7 8s7-2.6 7-7.4c0-3-1.6-4.6-3.6-5.6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="20.5" cy="35.5" r="2" fill="currentColor"/></svg>`,
  taste: `<svg viewBox="0 0 48 48" fill="none"><path d="M8 17h32c0 11.5-7.2 20-16 20S8 28.5 8 17z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M8 17c4-4 9-6 16-6s12 2 16 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M18 29c0-3.4 2.7-6 6-6s6 2.6 6 6-2.7 8-6 8-6-4.6-6-8z" fill="currentColor"/></svg>`,

};

/* Five animals, each a real record-holder for the sense it stands for.
   Chosen so a biologist can argue with the list — that's the conversation starter. */
const FAUNA = {
  /* Salticidae — sharpest eyes of any spider; the principal eyes have a moving retina.
     Also: she has posted about loving jumping spiders specifically. */
  spider: `<svg viewBox="0 0 100 100" fill="none">
    <g stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round">
      <path d="M36 52C26 46 20 36 18 27M36 56C25 55 16 50 10 43M37 61C27 64 20 70 16 79M40 66c-6 7-8 14-8 22"/>
      <path d="M64 52c10-6 16-16 18-25M64 56c11-1 20-6 26-13M63 61c10 3 17 9 21 18M60 66c6 7 8 14 8 22"/>
    </g>
    <ellipse cx="50" cy="66" rx="20" ry="22" fill="var(--ink)"/>
    <ellipse cx="50" cy="63" rx="12" ry="13" fill="var(--bg2)" opacity=".35"/>
    <ellipse cx="50" cy="40" rx="21" ry="18" fill="var(--ink)"/>
    <circle cx="41" cy="41" r="8.6" fill="var(--accent)"/><circle cx="59" cy="41" r="8.6" fill="var(--accent)"/>
    <circle class="eye" cx="41" cy="42" r="4.4" fill="#10160F"/><circle class="eye" cx="59" cy="42" r="4.4" fill="#10160F"/>
    <circle cx="43" cy="39.5" r="1.7" fill="#fff"/><circle cx="61" cy="39.5" r="1.7" fill="#fff"/>
    <circle cx="31" cy="33" r="3.1" fill="var(--accent)"/><circle cx="69" cy="33" r="3.1" fill="var(--accent)"/>
    <circle cx="38" cy="28" r="2.2" fill="var(--accent)"/><circle cx="62" cy="28" r="2.2" fill="var(--accent)"/>
  </svg>`,
  /* Tyto alba — asymmetric ear openings let it strike prey in total darkness. */
  owl: `<svg viewBox="0 0 100 100" fill="none">
    <path d="M50 14c17 0 29 12 29 30 0 24-14 42-29 42S21 68 21 44c0-18 12-30 29-30z" fill="var(--ink)"/>
    <path d="M50 22c12 0 21 9 21 22 0 18-10 31-21 31S29 62 29 44c0-13 9-22 21-22z" fill="var(--bg2)" opacity=".28"/>
    <circle cx="39" cy="43" r="8.2" fill="var(--accent)"/><circle cx="61" cy="43" r="8.2" fill="var(--accent)"/>
    <circle class="eye" cx="39" cy="44" r="4.6" fill="#10160F"/><circle class="eye" cx="61" cy="44" r="4.6" fill="#10160F"/>
    <circle cx="41" cy="41" r="1.8" fill="#fff"/><circle cx="63" cy="41" r="1.8" fill="#fff"/>
    <path d="M50 50l5 9h-10l5-9z" fill="var(--accent)"/>
    <path d="M50 60c0 8-3 14-3 14M50 60c0 8 3 14 3 14" stroke="var(--bg2)" stroke-width="2.4" opacity=".5" stroke-linecap="round"/>
  </svg>`,
  /* Condylura cristata — 22 rays, ~25 000 Eimer's organs; the most sensitive
     touch organ measured in any mammal. */
  mole: `<svg viewBox="0 0 100 100" fill="none">
    <path d="M82 58c8 4 12 10 13 16" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M24 54c2-11 12-18 28-18s30 8 30 18-12 19-30 19-26-8-28-19z" fill="var(--ink)"/>
    <g stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round">
      <path d="M24 54L7 54"/>
      <path d="M24 54L8 48.2"/><path d="M24 54L8 59.8"/>
      <path d="M24 54L11 43.1"/><path d="M24 54L11 64.9"/>
      <path d="M24 54L15.5 39.3"/><path d="M24 54L15.5 68.7"/>
      <path d="M24 54L21 37"/><path d="M24 54L21 71"/>
      <path d="M24 54L27 38"/><path d="M24 54L27 70"/>
    </g>
    <circle cx="24" cy="54" r="5.4" fill="var(--accent)"/>
    <circle cx="41" cy="48" r="2.8" fill="var(--bg2)"/>
    <g stroke="var(--accent)" stroke-width="3" stroke-linecap="round">
      <path d="M38 71l-4 9"/><path d="M44 72l-1 9"/><path d="M50 71l3 9"/>
    </g>
    <path d="M62 66c7 0 12 2 16 6" stroke="var(--bg2)" stroke-width="2.4" opacity=".4" stroke-linecap="round"/>
  </svg>`,
  /* Ursidae — olfactory epithelium several times larger than a bloodhound's. */
  bear: `<svg viewBox="0 0 100 100" fill="none">
    <circle cx="25" cy="27" r="12" fill="var(--ink)"/><circle cx="75" cy="27" r="12" fill="var(--ink)"/>
    <circle cx="25" cy="27" r="5.5" fill="var(--accent)" opacity=".55"/><circle cx="75" cy="27" r="5.5" fill="var(--accent)" opacity=".55"/>
    <path d="M50 22c19 0 31 14 31 33 0 21-14 32-31 32S19 76 19 55c0-19 12-33 31-33z" fill="var(--ink)"/>
    <circle class="eye" cx="37" cy="50" r="4.2" fill="var(--bg2)"/><circle class="eye" cx="63" cy="50" r="4.2" fill="var(--bg2)"/>

/* ---------------------------------------------------------- botany
   Leaves, vines and blooms for the Fauna style. Generated from a couple of
   primitives so layers stay consistent and cheap to retune. */
const BOTANY = (() => {
  const LEAF = "M0 0C7-10 21-14 31-10 26 2 13 9 0 0Z";
  const VEIN = "M2 -1C11-4 22-7 30-10";

  const leaf = (x, y, rot, s, fill, op = 1) =>
    `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${op}">
       <path d="${LEAF}" fill="${fill}"/>
       <path d="${VEIN}" stroke="rgba(6,18,10,.3)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
     </g>`;

  const strip = (cls, specs, fill) =>
    `<svg class="${cls}" viewBox="0 0 210 124" preserveAspectRatio="xMidYMax slice">
       ${specs.map(a => leaf(a[0], a[1], a[2], a[3], fill)).join("")}
     </svg>`;

  /* three overlapping fringes along the bottom edge, back to front */
  const back = strip("fx-leaves fx-back", [
    [-6,116,-72,1.55],[24,120,-98,1.7],[56,116,-58,1.45],[92,121,-108,1.6],
    [124,116,-76,1.5],[158,120,-48,1.5],[190,117,-96,1.6],
  ], "#163222");

  const mid = strip("fx-leaves fx-mid", [
    [6,121,-122,1.3],[38,124,-54,1.2],[72,121,-100,1.35],
    [106,125,-70,1.25],[140,121,-116,1.3],[174,124,-58,1.25],
  ], "#23512F");

  const front = strip("fx-leaves fx-front", [
    [-4,128,-86,1.2],[20,131,-44,1.05],[48,128,-112,1.15],[80,132,-64,1.1],
    [112,128,-96,1.2],[146,131,-40,1.05],[178,128,-102,1.15],[204,131,-68,1.1],
  ], "#31713E");

  /* small clusters creeping in from the top corners */
  const corner = (cls, specs) =>
    `<svg class="${cls}" viewBox="0 0 96 70">
       ${specs.map(a => leaf(a[0], a[1], a[2], a[3], "#1D4428")).join("")}
     </svg>`;
  const topLeft  = corner("fx-corner fx-tl", [[2,2,30,1.3],[0,20,66,1.15],[20,-2,6,1.0]]);
  const topRight = corner("fx-corner fx-tr", [[94,2,150,1.3],[96,20,114,1.15],[76,-2,174,1.0]]);

  /* sprigs creeping up the side bezels */
  const sprig = (cls, specs) =>
    `<svg class="${cls}" viewBox="0 0 58 52">
       ${specs.map(a => leaf(a[0], a[1], a[2], a[3], "#1F4A2B")).join("")}
     </svg>`;
  const sideL = sprig("fx-sprig fx-sl", [[0,8,-44,1.1],[0,30,-14,.95]]);
  const sideR = sprig("fx-sprig fx-sr", [[58,8,-136,1.1],[58,30,-166,.95]]);

  /* progress ring drawn as a living vine: stem arc + leaves along the grown part */
  const vine = (pct) => {
    const C = 351.86, off = C * (1 - pct), n = 9, sweep = pct * 360;
    let leaves = "";
    for (let i = 0; i < n; i++) {
      const deg = -90 + (sweep * i) / (n - 1);
      const rad = (deg * Math.PI) / 180;
      const x = 64 + 56 * Math.cos(rad), y = 64 + 56 * Math.sin(rad);
      leaves += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(deg + (i % 2 ? 128 : -128)).toFixed(1)}) scale(.5)">
          <path d="${LEAF}" fill="#7FC07A"/></g>`;
    }
    return `<svg class="ring vine" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="56" fill="none" stroke="#1E3B28" stroke-width="6"/>
        <circle class="stem" cx="64" cy="64" r="56" fill="none" stroke="#4E9B55" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off.toFixed(1)}"
                transform="rotate(-90 64 64)"/>
        ${leaves}
      </svg>`;
  };

  /* the "done" screen: a sprout that has just opened */
  const bloom = `<svg class="fx-bloom" viewBox="0 0 120 110">
      <path class="stem" d="M60 106V48" stroke="#4E9B55" stroke-width="5" stroke-linecap="round" fill="none"/>
      <g class="fx-leafL">${leaf(58, 84, -158, 1.45, "#31713E")}</g>
      <g class="fx-leafR">${leaf(62, 74, -22, 1.45, "#3E8A4A")}</g>
      <g transform="translate(60 40)"><g class="fx-petals">
        ${[0,72,144,216,288].map(a =>
          `<ellipse rx="11" ry="19" cy="-17" fill="#F2B33D" transform="rotate(${a})" opacity=".95"/>`).join("")}
        <circle r="9.5" fill="#FFE3A3"/><circle r="4.5" fill="#C98319"/>
      </g></g>
    </svg>`;

  const fireflies = (n = 5) =>
    `<div class="fx-flies">${Array.from({ length: n }, (_, i) =>
      `<i style="--i:${i}"></i>`).join("")}</div>`;

  return { LEAF, back, mid, front, topLeft, topRight, sideL, sideR, vine, bloom, fireflies };
})();

/* ------------------------------------------------------------ state */
let LANG = "uk";
let SENSE = 0;              /* which of the five steps screen 2 shows */
const L = () => T[LANG];

/* ------------------------------------------------------------ screens */
function ring(pct, label, sub, styleId) {
  /* r=56 → circumference 351.86 */
  const C = 351.86, off = C * (1 - pct);
  return `
    <svg class="ring" viewBox="0 0 128 128">
      <circle class="trk" cx="64" cy="64" r="56" fill="none" stroke-width="7"/>
      <circle class="val" cx="64" cy="64" r="56" fill="none" stroke-width="7"
              stroke-dasharray="${C}" stroke-dashoffset="${off}"
              transform="rotate(-90 64 64)"/>
      <text x="64" y="66" text-anchor="middle" dominant-baseline="middle"
            fill="currentColor" font-size="30" font-family="inherit"
            font-weight="${styleId === "clay" || styleId === "fauna" ? 600 : 300}"
            letter-spacing="-1">${label}</text>
    </svg>`;
}

/* Fauna is the only style with an environment behind the content. */
function scene(st, kind) {
  if (st.id !== "fauna") return "";
  return `<div class="scene">
    <div class="fx-shaft"></div>
    ${BOTANY.topLeft}${BOTANY.topRight}${BOTANY.sideL}${BOTANY.sideR}
    ${BOTANY.fireflies(kind === "done" ? 6 : 4)}
    ${BOTANY.back}${BOTANY.mid}${BOTANY.front}
  </div>`;
}

function screenTimer(st) {
  const t = L();
  const dial = st.id === "fauna"
    ? `<div class="dial">${BOTANY.vine(0.58)}<span class="dial-t">12:40</span></div>`
    : ring(0.58, "12:40", "", st.id);
  return scene(st, "timer") + `<div class="sc">
    <div class="sc-top">${t.ritual}</div>
    <div class="sc-mid">
      ${dial}
      <div class="sub">${t.timerSub}</div>
    </div>
  </div>`;
}

function screenStep(st) {
  const t = L(), s = t.senses[SENSE];
  const art = st.id === "fauna"
    ? `<div class="beast">${FAUNA[t.beasts[SENSE].art]}</div>
       <div class="latin">${t.beasts[SENSE].name}</div>`
    : `<div class="glyph">${ICON[s.icon]}</div>`;
  return scene(st, "step") + `<div class="sc">
    <div class="sc-top">${s.name}</div>
    <div class="sc-mid">
      ${art}
      <div class="big">${s.n}</div>
      <div class="sub">${s.sub}</div>
    </div>
    <div class="sc-acts">
      <button class="btn pri">${ICON.check}${t.ok}</button>
      <button class="btn sq" aria-label="${t.say}">${ICON.mic}</button>
    </div>
  </div>`;
}

function screenDone(st) {
  const t = L();
  const art = st.id === "fauna"
    ? BOTANY.bloom
    : `<div class="glyph">${ICON.check}</div>`;
  return scene(st, "done") + `<div class="sc">
    <div class="sc-top">${t.doneTitle}</div>
    <div class="sc-mid">
      ${art}
      <div class="chips">${t.senses.map(s => `<i>${s.n}</i>`).join("")}</div>
      <div class="sub">${t.doneSub}</div>
    </div>
    <div class="sc-acts">
      <button class="btn pri">${t.yes}</button>
      <button class="btn">${t.later}</button>
    </div>
  </div>`;
}

const SCREENS = [screenTimer, screenStep, screenDone];

/* ------------------------------------------------------------ render */
function render() {
  const t = L();
  document.documentElement.lang = LANG;
  document.getElementById("h1").textContent = t.h1;
  document.getElementById("lede").innerHTML = t.lede;
  document.getElementById("foot").innerHTML = t.foot;

  document.getElementById("bar").innerHTML =
    `<span class="chip" style="cursor:default;border:0;background:0;padding-left:0">${t.lang}</span>` +
    ["uk", "en"].map(l =>
      `<button class="chip" data-lang="${l}" aria-pressed="${l === LANG}">${l.toUpperCase()}</button>`
    ).join("") +
    `<span class="sep"></span>` +
    t.senses.map((s, i) =>
      `<button class="chip" data-sense="${i}" aria-pressed="${i === SENSE}">${s.n} · ${s.name}</button>`
    ).join("");

  document.getElementById("board").innerHTML = t.styles.map((st, i) => `
    <section class="st-${st.id}">
      <div class="shead">
        <span class="snum">0${i + 1}</span>
        <span class="sname">${st.name}</span>
        <span class="stag">${st.tag}</span>
      </div>
      <p class="swhy">${st.why}</p>
      <div class="row">
        ${SCREENS.map((fn, j) => `
          <div class="cell">
            <div class="watch"><div class="screen">${fn(st)}</div></div>
            <div class="clabel">${t.screens[j]}</div>
          </div>`).join("")}
      </div>
      ${st.id === "fauna" ? `<div class="legend">${t.beasts.map(b => `
        <div class="lcard">
          ${FAUNA[b.art]}
          <div class="lsense">${b.sense}</div>
          <div class="lname">${b.name}</div>
          <div class="lwhy"><em>${b.latin}</em> — ${b.why}</div>
        </div>`).join("")}</div>` : ""}
    </section>`).join("");
}

/* Browser only — the design-system build imports this file in Node. */
if (typeof document !== "undefined") {
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-lang],[data-sense]");
    if (!b) return;
    if (b.dataset.lang) LANG = b.dataset.lang;
    else SENSE = +b.dataset.sense;
    render();
  });
  render();
}
